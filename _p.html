<!doctype html><meta charset="utf-8"><body><pre id="o"></pre>
<script>
const log=(m)=>{document.getElementById('o').textContent+=m+'\n';};
(async()=>{try{
const f=document.createElement('iframe'); f.style.cssText='width:1600px;height:1400px;border:0'; f.src='/index.html';
document.body.appendChild(f); await new Promise(r=>f.onload=r); await new Promise(r=>setTimeout(r,1400));
const w=f.contentWindow,d=f.contentDocument;
const wait=(ms)=>new Promise(r=>setTimeout(r,ms||350));
const set=async(id,v)=>{const e=d.getElementById(id);e.value=v;e.dispatchEvent(new w.Event('change',{bubbles:true}));await wait();};
// capture the class the moment the lazy-loaded bundle assigns it
w.eval(`window.__deck=null; let _P=null;
 Object.defineProperty(window,'PptxGenJS',{configurable:true,
   get(){return _P;},
   set(v){ _P=v; if(v&&v.prototype&&!v.prototype.__patched){ v.prototype.__patched=true;
     v.prototype.writeFile=async function(){ window.__deck=await this.write({outputType:'base64'}); return 'captured'; }; } }});`);
await set('w-profile','core'); await set('w-node','smc-b300'); w.go(5); await wait(600);
d.getElementById('btn-pptx').click();
for(let i=0;i<80 && !w.__deck;i++) await wait(500);
if(!w.__deck) log('no deck captured');
else { log('deck captured: '+w.__deck.length+' base64 chars');
  const pre=document.createElement('pre'); pre.id='b64'; pre.textContent=w.__deck; document.body.appendChild(pre); }
}catch(e){log('THREW '+e.message+' '+e.stack);}})();
</script></body>
